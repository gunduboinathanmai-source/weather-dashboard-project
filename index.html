<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Advanced Weather App</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      background:linear-gradient(to right,#4facfe,#00f2fe);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .container{
      width:350px;
      background:white;
      padding:20px;
      border-radius:20px;
      text-align:center;
      box-shadow:0 0 15px rgba(0,0,0,0.2);
      transition:0.3s;
    }

    .dark{
      background:#222;
      color:white;
    }

    h1{
      margin-bottom:20px;
    }

    input{
      width:100%;
      padding:12px;
      border:1px solid gray;
      border-radius:10px;
      margin-bottom:10px;
      outline:none;
      font-size:16px;
    }

    button{
      padding:10px 15px;
      border:none;
      border-radius:10px;
      background:#0077ff;
      color:white;
      cursor:pointer;
      margin:5px;
      transition:0.3s;
    }

    button:hover{
      background:#0056cc;
    }

    .weather{
      margin-top:20px;
      display:none;
    }

    .weather img{
      width:120px;
    }

    .temp{
      font-size:50px;
      font-weight:bold;
    }

    .details{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:20px;
    }

    .card{
      background:#f1f1f1;
      padding:15px;
      border-radius:10px;
    }

    .dark .card{
      background:#333;
    }

    .forecast{
      margin-top:20px;
      display:flex;
      overflow-x:auto;
      gap:10px;
    }

    .forecast-box{
      min-width:70px;
      background:#f1f1f1;
      padding:10px;
      border-radius:10px;
    }

    .dark .forecast-box{
      background:#333;
    }

    .error{
      color:red;
      margin-top:10px;
    }
    .weather img{
    width:120px;
    animation: float 2s infinite ease-in-out;
}

@keyframes float{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-10px);
}

100%{
transform:translateY(0px);
}

}
.container{
    width:350px;
    background:rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    padding:20px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 8px 32px rgba(0,0,0,0.2);
    transition:0.4s;
}
body{
    background:linear-gradient(to right,#4facfe,#00f2fe);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}
.weather img{
    width:150px;
    animation: float 3s infinite ease-in-out;
}

@keyframes float{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-15px);
}

100%{
transform:translateY(0px);
}


}
  </style>
</head>

<body>

<div class="container" id="box">

  <h1>🌦️ Weather Dashboard</h1>

  <input
  type="text"
  class="city-input"
  placeholder="Enter city name">

  <button class="search-btn">
    Search
  </button>

  <button onclick="getLocationWeather()">
    📍 Location
  </button>

  <button onclick="toggleDarkMode()">
    🌙 Mode
  </button>

  
  <p class="error" id="error"></p>
  
<p id="loading"style="display:none;">
  loading weather...
  </p>
  
<p id="error-message"></p>

  <div class="weather" id="weather">

    <h2 class="city-name"></h2>
    <p id="time"></p>

    <img id="icon">

    <div class="temp temperature"></div>

    <h3 id="condition"></h3>

    <div class="details">

      <div class="card">
        <h4>Humidity</h4>
        <p class="humidity"></p>
      </div>

      <div class="card">
        <h4>Wind</h4>
        <p class="wind"></p>
      </div>

      <div class="card">
        <h4>Feels Like</h4>
        <p class="feels-like"></p>
      </div>

      <div class="card">
        <h4>Pressure</h4>
        <p class="pressure"></p>
      </div>

    </div>

    <div class="forecast" id="forecast"></div>

  </div>
  
<p class = "footer">
Made by Thanmai Gunduboina 
</p>
</div>



<script src="script.js"></script>

</body>
</html>
